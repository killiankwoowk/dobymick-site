<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Message for You</title>
    <style>
        body { font-family: 'Georgia', serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #fdfdfd; color: #333; }
        .content { max-width: 600px; padding: 40px; line-height: 1.8; text-align: center; display: none; }
        #gate { text-align: center; }
        input { padding: 10px; border: 1px solid #ccc; border-radius: 5px; margin-top: 10px; }
        button { padding: 10px 20px; background: #333; color: white; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="gate">
        <h3>Enter the password to read the message</h3>
        <input type="password" id="passInput" placeholder="Password...">
        <button onclick="checkPass()">Enter</button>
    </div>

    <div id="message" class="content">
        <p>
            Your long paragraph goes here... (e.g., "I wanted to tell you how much I appreciate everything...")
        </p>
    </div>

    <script>
        function checkPass() {
            const pass = document.getElementById('passInput').value;
            // CHANGE "yourpassword" to your chosen secret word
            if (pass === "yourpassword") {
                document.getElementById('gate').style.display = 'none';
                document.getElementById('message').style.display = 'block';
            } else {
                alert("Incorrect password.");
            }
        }
    </script>
</body>
</html>
